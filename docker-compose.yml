# Sistem terdistribusi: Nginx + 2 app server Flask + Redis.
# Jalankan: docker compose up --build -d
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app1:
    build: ./src/app
    environment:
      - SERVER_NAME=app1
      - REDIS_HOST=redis
    networks: [backend]
    depends_on:
      redis:
        condition: service_healthy

  app2:
    build: ./src/app
    environment:
      - SERVER_NAME=app2
      - REDIS_HOST=redis
    networks: [backend]
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [backend]
    depends_on: [app1, app2]

volumes:
  redis-data:

networks:
  backend:
    driver: bridge
